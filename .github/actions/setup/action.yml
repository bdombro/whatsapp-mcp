name: Setup C++ toolchain and vcpkg
description: Install Homebrew toolchain packages and bootstrap vcpkg with binary caching

runs:
  using: composite
  steps:
    - name: Install macOS toolchain
      if: runner.os == 'macOS'
      shell: bash
      run: brew install llvm@23 ninja just bun jq

    - name: Install Linux toolchain
      if: runner.os == 'Linux'
      shell: bash
      run: |
        /home/linuxbrew/.linuxbrew/bin/brew install llvm@23 ninja just bun jq
        echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
        echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        {
          echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX"
          echo "HOMEBREW_CELLAR=$HOMEBREW_CELLAR"
          echo "HOMEBREW_REPOSITORY=$HOMEBREW_REPOSITORY"
        } >> "$GITHUB_ENV"

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: client/go.mod
        cache-dependency-path: client/go.sum

    - name: Read vcpkg baseline
      id: vcpkg-ref
      shell: bash
      run: |
        config_file=""
        if [ -f vcpkg-configuration.json ]; then
          config_file="vcpkg-configuration.json"
        else
          shopt -s nullglob
          candidates=(*/vcpkg-configuration.json */*/vcpkg-configuration.json)
          if [ "${#candidates[@]}" -eq 1 ]; then
            config_file="${candidates[0]}"
          elif [ "${#candidates[@]}" -gt 1 ]; then
            echo "::error::Multiple vcpkg-configuration.json files found: ${candidates[*]}"
            exit 1
          fi
        fi
        baseline=""
        vcpkg_glob="vcpkg*.json"
        triplets_glob="triplets/*.cmake"
        if [ -n "$config_file" ]; then
          baseline="$(jq -r '.["default-registry"].baseline // empty' "$config_file")"
          if [ -n "$baseline" ] && ! [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::default-registry.baseline in $config_file must be a 40-char commit SHA"
            exit 1
          fi
          config_dir="$(dirname "$config_file")"
          if [ "$config_dir" != "." ]; then
            vcpkg_glob="$config_dir/vcpkg*.json"
            triplets_glob="$config_dir/triplets/*.cmake"
          fi
        fi
        {
          echo "baseline=$baseline"
          echo "vcpkg_glob=$vcpkg_glob"
          echo "triplets_glob=$triplets_glob"
        } >> "$GITHUB_OUTPUT"

    - name: Detect cache environment
      if: steps.vcpkg-ref.outputs.baseline != ''
      id: env
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "macOS" ]; then
          triplet="arm64-osx"
        else
          triplet="x64-linux"
        fi
        clang_bin="$(brew --prefix llvm@23)/bin/clang++"
        ver="$("$clang_bin" --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
        if [ -z "$ver" ]; then
          echo "::error::Cannot determine llvm@23 clang++ major version"
          exit 1
        fi
        {
          echo "triplet=$triplet"
          echo "compiler=clang-$ver"
        } >> "$GITHUB_OUTPUT"

    - name: Checkout vcpkg
      if: steps.vcpkg-ref.outputs.baseline != ''
      shell: bash
      run: |
        rm -rf "$RUNNER_TEMP/vcpkg"
        git init "$RUNNER_TEMP/vcpkg"
        git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
        git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "${{ steps.vcpkg-ref.outputs.baseline }}"
        git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD

    - name: Bootstrap vcpkg
      if: steps.vcpkg-ref.outputs.baseline != ''
      shell: bash
      run: |
        "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        mkdir -p "$RUNNER_TEMP/vcpkg-cache"
        echo "$RUNNER_TEMP/vcpkg" >> "$GITHUB_PATH"
        {
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache"
        } >> "$GITHUB_ENV"

    - name: Cache vcpkg binaries
      if: steps.vcpkg-ref.outputs.baseline != ''
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ steps.env.outputs.triplet }}-${{ steps.env.outputs.compiler }}-${{ steps.vcpkg-ref.outputs.baseline }}-${{ hashFiles(steps.vcpkg-ref.outputs.vcpkg_glob, 'ports/*/vcpkg.json', steps.vcpkg-ref.outputs.triplets_glob) }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ steps.env.outputs.triplet }}-${{ steps.env.outputs.compiler }}-${{ steps.vcpkg-ref.outputs.baseline }}-
          vcpkg-${{ runner.os }}-${{ steps.env.outputs.triplet }}-${{ steps.env.outputs.compiler }}-
