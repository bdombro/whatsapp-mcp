name: release
on:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      runners: ${{ steps.plan.outputs.runners || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runners="$(just --evaluate platforms | jq -Rc 'split(" ") | map(select(length > 0) | {macos: "macos-26", linux: "ubuntu-24.04"}[.] // error("unknown platform: \(.)"))')"
          plan_json="$(bun scripts/release.ts plan)"
          should_release="$(printf '%s' "$plan_json" | jq -r '.should_release')"
          version="$(printf '%s' "$plan_json" | jq -r '.version')"
          {
            echo "should_release=$should_release"
            echo "version=$version"
            echo "runners=$runners"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    env:
      BUGSINK_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build release
        run: |
          printf '%s\n' "${{ needs.plan.outputs.version }}" > VERSION
          just build
      - name: Package release assets
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            target="arm64-macos"
          else
            target="x64-linux"
          fi
          if [ "${{ runner.os }}" = "macOS" ] && [ -d mcp/build/bin ]; then
            while IFS= read -r bin; do
              bad_libs="$(otool -L "$bin" | tail -n +2 | sed -E 's/^[[:space:]]+([^[:space:]]+).*/\1/' | grep -Ev '^(/System/Library/|/usr/lib/libSystem\.B\.dylib$|/usr/lib/libobjc\.A\.dylib$)' || true)"
              if [ -n "$bad_libs" ]; then
                echo "::error::macOS release binary $bin links unexpected libraries: $bad_libs"
                exit 1
              fi
              exported="$(nm -gU "$bin")"
              if [ -n "$exported" ]; then
                echo "::error::macOS release binary $bin must not export symbols (missing -Wl,-exported_symbols_list,/dev/null)"
                exit 1
              fi
            done < <(find mcp/build/bin -type f -perm -u+x)
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            if ldd mcp/build/bin/* | grep -q 'libc++\.so'; then
              echo "::error::Linux release binary must not dynamically link libc++.so"
              exit 1
            fi
            mcp/build/bin/whatsapp-mcp --version
          fi
          mkdir -p dist
          tar -czf "dist/whatsapp-client-${target}.tar.gz" -C client/dist .
          tar -czf "dist/whatsapp-mcp-${target}.tar.gz" -C mcp/build/bin .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/whatsapp-*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.should_release == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Configure git author
        run: |
          git config user.name "bdombro-release-bot[bot]"
          git config user.email "bdombro-release-bot[bot]@users.noreply.github.com"
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun scripts/release.ts publish "${{ needs.plan.outputs.version }}" assets
