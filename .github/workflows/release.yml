name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
concurrency: release
permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      runners: ${{ steps.plan.outputs.runners }}
      run_test: ${{ steps.test-check.outputs.run_test }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - id: plan
        run: |
          version="$(bun scripts/release.ts next "${{ inputs.bump }}")"
          runners="$(just --evaluate platforms | jq -Rc 'split(" ") | map(select(length > 0) | {macos: "macos-26", linux: "ubuntu-24.04"}[.] // error("unknown platform: \(.)"))')"
          {
            echo "version=$version"
            echo "runners=$runners"
          } >> "$GITHUB_OUTPUT"
      - id: test-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_test=true
          if runs_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId,event,headBranch 2>&1)"; then
            if printf '%s' "$runs_json" | jq -e 'length > 0' >/dev/null 2>&1; then
              run_test=false
              match="$(printf '%s' "$runs_json" | jq -r '.[0] | "id=\(.databaseId) event=\(.event) branch=\(.headBranch)"')"
              echo "Skipping test job; found passing test.yml run ($match)"
            else
              echo "No passing test.yml run for $GITHUB_SHA; running test job"
            fi
          else
            echo "::warning::gh run list failed ($runs_json); falling back to running test job"
          fi
          echo "run_test=$run_test" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.run_test == 'true'
    uses: ./.github/workflows/test.yml

  build:
    needs: [plan, test]
    if: always() && !cancelled() && needs.plan.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    env:
      BUGSINK_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build release
        run: |
          printf '%s\n' "${{ needs.plan.outputs.version }}" > VERSION
          just build
      - name: Package release assets
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            target="arm64-macos"
          else
            target="x64-linux"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            if find mcp/build/bin -type f -perm -u+x -exec otool -L {} + | grep -F "$(brew --prefix)/"; then
              echo "::error::macOS release binary must not link Homebrew libraries"
              exit 1
            fi
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            if ldd mcp/build/bin/* | grep -q 'libc++\.so'; then
              echo "::error::Linux release binary must not dynamically link libc++.so"
              exit 1
            fi
            mcp/build/bin/whatsapp-mcp --version
          fi
          mkdir -p dist
          tar -czf "dist/whatsapp-client-${target}.tar.gz" -C client/dist .
          tar -czf "dist/whatsapp-mcp-${target}.tar.gz" -C mcp/build/bin .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/whatsapp-*
          if-no-files-found: error

  publish:
    needs: [plan, test, build]
    if: always() && !cancelled() && needs.plan.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Configure git author
        run: |
          git config user.name "$(git log -1 --format='%an')"
          git config user.email "$(git log -1 --format='%ae')"
      - run: bun scripts/release.ts publish "${{ needs.plan.outputs.version }}" assets
